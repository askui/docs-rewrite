name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build with Next (static export)
        run: pnpm build
        env:
          # Cutover toggle: set the repo variable DOCS_SERVE_AT_ROOT to "true"
          # (Settings → Secrets and variables → Actions → Variables) to build for
          # the custom-domain root docs.askui.com. Unset/anything else keeps the
          # project-page build under /docs-rewrite. Both branches are non-empty
          # on purpose — GitHub Actions expressions treat "" as unset. "ROOT" is
          # the sentinel the app maps to an empty base path.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.DOCS_SERVE_AT_ROOT == 'true' && 'ROOT' || '/docs-rewrite' }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Next static export output. basePath (/docs-rewrite) is set in next.config.mjs.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
