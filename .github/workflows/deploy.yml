name: Deploy to GitHub Pages

# Docs content is released, not merged: every version's pages come from a
# release tag (v0.11.0, set when the app version is released), so unreleased
# docs on main never go live. The site shell (layout, components, search,
# tracking, SEO) always comes from main. Hence the triggers:
#   - a release tag deploys a new docs version (release candidates, v*-*, do not);
#   - a merge to main deploys shell changes, with the released content unchanged;
#   - run it by hand to redeploy, e.g. after a fix tag on an older version's
#     release branch, which does not carry this workflow.
on:
  push:
    branches: [main]
    tags: ['v*', '!v*-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site shell always comes from main, whatever triggered the run. The
      # content of every version comes from the release tags (--release below),
      # so a fix tag on an older version (v0.9.1) never makes it the newest one.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          # Every release tag: scripts/build-versioned.mjs builds the versions
          # from them.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # PostHog project API key (public, write-only), the same project as
      # www.askui.com, and the Zapier catch-hook for installer download pings
      # (the same hook as www.askui.com's /start). Read from 1Password with the
      # repo's service account (sa-docs-rewrite, read-only on plat-tracking).
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          POSTHOG_KEY: "op://plat-tracking/Posthog Production/POSTHOG_KEY"
          DOWNLOAD_WEBHOOK_URL: "op://plat-tracking/Zapier/Download Webhook"
      - name: Build the versioned site (static export)
        run: pnpm build:versioned --release
        env:
          # Cutover toggle: set the repo variable DOCS_SERVE_AT_ROOT to "true"
          # (Settings → Secrets and variables → Actions → Variables) to build for
          # the custom-domain root docs.askui.com. Unset/anything else keeps the
          # project-page build under /docs-rewrite. Both branches are non-empty
          # on purpose — GitHub Actions expressions treat "" as unset. "ROOT" is
          # the sentinel the app maps to an empty base path.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.DOCS_SERVE_AT_ROOT == 'true' && 'ROOT' || '/docs-rewrite' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ steps.op.outputs.POSTHOG_KEY }}
          NEXT_PUBLIC_DOWNLOAD_WEBHOOK_URL: ${{ steps.op.outputs.DOWNLOAD_WEBHOOK_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Next static export output. basePath (/docs-rewrite) is set in next.config.mjs.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
