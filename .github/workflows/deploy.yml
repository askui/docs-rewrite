name: Deploy to GitHub Pages

# The docs are released, not merged, onto docs.askui.com: a merge to main
# publishes nothing. Pushing a release tag (v0.11.0, set when the app version is
# released) deploys the whole versioned site. Release candidates (v*-*) do not.
# Run it by hand to redeploy, e.g. after a fix tag on an older version's
# release branch, whose own commit does not carry this workflow.
on:
  push:
    tags: ['v*', '!v*-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress on a new push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Every release tag: scripts/build-versioned.mjs builds the older
          # docs versions from them.
          fetch-depth: 0
      # Always build from the newest release tag, whatever triggered the run, so
      # a fix tag on an older version (v0.9.1) never makes that version the
      # newest one. The newest tag's commit supplies the site shell and the
      # newest version's content.
      - name: Check out the newest release tag
        run: |
          tag=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$tag" ]; then echo "::error::no release tag v<major>.<minor>.<patch> found"; exit 1; fi
          git checkout --detach "$tag"
          if [ ! -f scripts/build-versioned.mjs ]; then
            echo "::error::$tag predates versioned docs (no scripts/build-versioned.mjs); tag a newer release first"
            exit 1
          fi
          echo "Building the docs site from $tag"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # PostHog project API key (public, write-only), the same project as
      # www.askui.com, and the Zapier catch-hook for installer download pings
      # (the same hook as www.askui.com's /start). Read from 1Password with the
      # repo's service account (sa-docs-rewrite, read-only on plat-tracking).
      - name: Load secrets
        id: op
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          POSTHOG_KEY: "op://plat-tracking/Posthog Production/POSTHOG_KEY"
          DOWNLOAD_WEBHOOK_URL: "op://plat-tracking/Zapier/Download Webhook"
      - name: Build the versioned site (static export)
        run: pnpm build:versioned
        env:
          # Cutover toggle: set the repo variable DOCS_SERVE_AT_ROOT to "true"
          # (Settings → Secrets and variables → Actions → Variables) to build for
          # the custom-domain root docs.askui.com. Unset/anything else keeps the
          # project-page build under /docs-rewrite. Both branches are non-empty
          # on purpose — GitHub Actions expressions treat "" as unset. "ROOT" is
          # the sentinel the app maps to an empty base path.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.DOCS_SERVE_AT_ROOT == 'true' && 'ROOT' || '/docs-rewrite' }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ steps.op.outputs.POSTHOG_KEY }}
          NEXT_PUBLIC_DOWNLOAD_WEBHOOK_URL: ${{ steps.op.outputs.DOWNLOAD_WEBHOOK_URL }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Next static export output. basePath (/docs-rewrite) is set in next.config.mjs.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
